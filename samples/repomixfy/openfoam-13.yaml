repomixfy:
  url: https://github.com/OpenFOAM/OpenFOAM-13.git
  branch: master
  repo_dir: openfoam-13
  output_dir: openfoam-13_mix
  size_max: 4.0
  force_write: true

  ignore_files:
    - .gitattributes
    - .gitignore
    - COPYING
    - Allwmake
    - Allwclean
    - Allmake
    - Allclean
    - Alltest

    # Keep all run, as it provides indications on how to use tools.
    # - Allrun

    # Large file at tutorials/XiFluid/kivaTest/otape17:
    - otape17

    # Just coordinates of particles:
    - cloudPositions

    # tutorials\shockFluid\biconic25-55Run35\constant:
    - grid256.dat

    # Some provided polyMesh data:
    - polyMesh/cells
    - polyMesh/faces
    - polyMesh/owner
    - polyMesh/neighbour
    - polyMesh/points

  ignore_dirs:
    - .git
    - wmake
    - Make
    - Doxygen

  ignore_ext:
    - .pdf
    - .png
    - .jpg
    - .jpeg
    - .gif
    - .stl
    - .obj
    - .msh
    - .unv
    - .svg
    - .gz
    - .tar

  fences_map:
    .C: c++
    .H: c++
    .cxx: c++
    .h: c++