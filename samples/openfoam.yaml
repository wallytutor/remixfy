repomixfy:
  url: https://github.com/OpenFOAM/OpenFOAM-13.git
  branch: master
  repo_dir: openfoam-13
  output_dir: openfoam-13_mix
  size_max: 4.0
  force_write: true

  ignore_files:
    - .gitattributes
    - .gitignore
    - COPYING
    - Allwmake
    - Allwclean
    - Allmake
    - Allclean
    - Allrun
    - Alltest

  ignore_dirs:
    - .git
    - wmake
    - Make
    - Doxygen

  ignore_ext:
    - .pdf
    - .png
    - .jpg
    - .jpeg
    - .gif
    - .svg
    - .gz
    - .tar

  fences_map:
    .C: c++
    .H: c++
    .cxx: c++
    .h: c++